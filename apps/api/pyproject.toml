[project]
name = "build-block-api"
version = "0.1.0"
description = "Build-Block generation API and RAG pipeline"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_block"]

[tool.ruff]
line-length = 100
target-version = "py312"
