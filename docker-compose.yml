services:
  db:
    image: pgvector/pgvector:pg16
    container_name: build-block-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: buildblock
    volumes:
      - build_block_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildblock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  build_block_pgdata:
